data:
  dataset: 5F
  info_path: configs/dataset/5F.yaml
  subjects:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
experiment:
  description: '5F finger MI within-subject: ADFCNN + 5-fold GroupKFold'
  name: 5F_ADFCNN_Supervised_KFold
  seed: 42
logging:
  console: true
  level: INFO
  tensorboard: false
model:
  args: {}
  type: ADFCNN
paths:
  root_dir: ./experiments
trainer:
  args: {}
  type: SupervisedTrainer
training:
  batch_size: 32
  deterministic: false
  device: cuda
  early_stopping:
    enabled: true
    min_delta: 0.001
    patience: 20
  epochs: 150
  k_folds: 5
  optimizer:
    lr: 0.001
    type: Adam
    weight_decay: 0.01
  save_checkpoints: true
  save_optimizer_state: false
  scheduler:
    type: cosine
  use_fp16_compression: true
visualization:
  plot_history: true
  plot_subject_comparison: true
  save_format: png
