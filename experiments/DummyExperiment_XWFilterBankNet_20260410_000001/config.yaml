data:
  dataset: XWStroke
  info_path: configs/dataset/XWStroke.yaml
  subjects:
  - 1
  - 2
  - 3
  - 6
  - 7
  - 11
  - 19
  - 29
  - 40
  - 45
experiment:
  description: Dummy experiment for comparison testing using XWFilterBankNet
  name: DummyExperiment_XWFilterBankNet
  seed: 42
logging:
  console: true
  level: INFO
  tensorboard: false
model:
  args:
    band_channels: 32
    classifier_hidden: 0
    dropout: 0.3
    temporal_kernel: 64
    use_attention: true
  type: XWFilterBankNet
paths:
  checkpoint_dir: ./src/checkpoints
  data_dir: ./src/datasets
  root_dir: ./experiments
trainer:
  args: {}
  type: SupervisedTrainer
training:
  batch_size: 32
  deterministic: false
  device: cuda
  early_stopping:
    enabled: false
    min_delta: 0.001
    patience: 30
  epochs: 150
  k_folds: 5
  optimizer:
    lr: 0.0005
    type: Adam
    weight_decay: 0.5
  scheduler:
    type: cosine
visualization:
  plot_history: true
  plot_subject_comparison: true
  save_format: png
