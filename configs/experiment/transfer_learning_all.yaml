# Transfer Learning Configuration - Feature Extractor (all strategy)
# Use this when target data is limited, only train the classifier head

experiment:
  name: "TL_All_XWStroke_EEGNet"
  seed: 42

data:
  dataset: "XWStroke"
  subjects: [2, 3, 4, 5]
  info_path: "configs/dataset/XWStroke.yaml"

model:
  type: "EEGNet"
  args: {}

training:
  device: "cuda"
  epochs: 50  # Fewer epochs needed for feature extraction
  batch_size: 32
  k_folds: 5
  save_checkpoints: true
  use_fp16_compression: true
  
  optimizer:
    type: "Adam"
    lr: 0.001
    weight_decay: 0.01

trainer:
  type: "TransferLearningTrainer"
  args:
    # Path to pretrained checkpoint
    pretrained_path: "experiments/pretrain_xwstroke/checkpoints/subject_1_fold_0_acc_0.8500.pt"
    
    # Freeze all feature layers, only train classifier
    freeze_strategy: "all"

paths:
  root_dir: "./experiments"

logging:
  level: "INFO"
  console: true
