data:
  dataset: BCICIV2a
  info_path: configs/dataset/BCICIV2a.yaml
  subjects:
  - 1
experiment:
  description: Default EEG-BCI experiment configuration
  name: test_bciciv2a_adfcnn
  seed: 42
logging:
  console: true
  level: INFO
  tensorboard: false
model:
  args: {}
  type: ADFCNN
paths:
  checkpoint_dir: ./src/checkpoints
  data_dir: ./src/datasets
  root_dir: ./experiments
trainer:
  args: {}
  type: SupervisedTrainer
training:
  batch_size: 32
  deterministic: false
  device: cuda
  early_stopping:
    enabled: false
    min_delta: 0.001
    patience: 20
  epochs: 2
  k_folds: 2
  optimizer:
    lr: 0.001
    type: Adam
    weight_decay: 0.01
  scheduler:
    type: cosine
visualization:
  plot_history: true
  plot_subject_comparison: true
  save_format: png
