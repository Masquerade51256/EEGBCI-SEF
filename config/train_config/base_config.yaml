# Selection
# DATASETS = {
#     1: 'BCICIV2a',
#     2: 'BCICIV2b',
#     3: 'XWStroke',
# }
dataset_id: 3
# MODELS = {
#     1: 'EEGNet',
#     2: 'CNNLSTM',
#     3: 'ADFCNN',
#     4: 'MultiBand_CNNLSTM',
#     5: 'Simplified_MultiBand_CNNLSTM',
# }
model_id: 3

# Mode
# is_test = False

# Preprocessing Config
Preprocessing:
  window_length: 2
  window_stride: 1
  filter_banks:
    - [4, 40]
  need_resample: False
  target_sample_rate: 250


# Training Config
Training:
  target_subjects: [1,2,3,4,5,6,7,8,9]
  train_device: 'cuda'
  batch_size: 16
  num_epochs: 30
  learning_rate: 0.001
  weight_decay: 0.075
  k_folds: 5