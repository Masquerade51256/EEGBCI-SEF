# BCICIV2a LOSO with EEGNet + StreamingLOSOTrainer
# Purpose: Framework sanity check - verify if the training pipeline itself
# is capable of achieving reasonable cross-subject performance on a
# well-studied benchmark (BCICIV2a).
#
# Literature reference for EEGNet on BCICIV2a LOSO (4-class):
#   - Lawhern et al. 2018: ~58-70% cross-subject
#   - If our framework achieves < 50%, the pipeline (not model/data) is suspect.

experiment:
  name: "BCICIV2a_EEGNet_StreamingLOSO"
  seed: 42
  description: "BCICIV2a 9-subject Streaming LOSO with EEGNet (framework validation)"

data:
  dataset: "BCICIV2a"
  subjects: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  info_path: "configs/dataset/BCICIV2a.yaml"

model:
  type: "EEGNet"
  args: {}

training:
  device: "cuda"
  epochs: 100
  batch_size: 256
  save_checkpoints: true
  use_fp16_compression: true
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

  optimizer:
    type: "Adam"
    lr: 0.001
    weight_decay: 0.01

trainer:
  type: "StreamingLOSOTrainer"
  args:
    subject_buffer_size: 8
    gradient_accumulation_steps: 1
    mixed_precision: true

paths:
  root_dir: "./experiments"

logging:
  level: "INFO"
  console: true
