# XWStroke dataset with EEGNet model

experiment:
  name: "XWStroke_ADFCNN"
  seed: 42
  description: "XW Stroke dataset classification using ADFCNN"

data:
  dataset: "XWStroke"
  subjects: [1,2,3,6,7,11,19,29,40,45]
  info_path: "configs/dataset/XWStroke.yaml"

model:
  type: "ADFCNN"
  args: {}

training:
  device: "cuda"
  epochs: 200
  batch_size: 32
  k_folds: 5
  deterministic: false
  
  optimizer:
    type: "Adam"
    lr: 0.001
    weight_decay: 0.5
  
  scheduler:
    type: "cosine"
    
  early_stopping:
    enabled: false
    patience: 30
    min_delta: 0.001

trainer:
  type: "SupervisedTrainer"
  args: {}

paths:
  root_dir: "./experiments"
  data_dir: "./src/datasets"
  checkpoint_dir: "./src/checkpoints"

logging:
  level: "INFO"
  console: true
  tensorboard: false

visualization:
  plot_history: true
  plot_subject_comparison: true
  save_format: "png"
