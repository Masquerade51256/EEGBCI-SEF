data:
  dataset: XWStroke
  info_path: configs/dataset/XWStroke_subset15_affected.yaml
  subjects:
  - 5
  - 7
  - 8
  - 9
  - 10
  - 12
  - 15
  - 16
  - 19
  - 30
  - 31
  - 32
  - 40
  - 43
  - 49
experiment:
  description: LOSO cross-validation on 15-subject subset with affected/unaffected
    labels
  name: XWStroke_Subset15_LOSO_Affected
  seed: 42
logging:
  console: true
  level: INFO
model:
  args: {}
  type: ADFCNN
paths:
  root_dir: ./experiments
trainer:
  args:
    balance_classes: false
    inner_k_folds: 0
  type: LOSOTrainer
training:
  batch_size: 64
  device: cuda
  epochs: 100
  optimizer:
    lr: 0.001
    type: Adam
    weight_decay: 0.01
  save_checkpoints: true
  use_fp16_compression: true
