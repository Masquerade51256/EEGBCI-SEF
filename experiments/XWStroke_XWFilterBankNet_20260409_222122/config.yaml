data:
  dataset: XWStroke
  info_path: configs/dataset/XWStroke_multiband.yaml
  subjects: all
experiment:
  description: XW Stroke dataset classification using XWFilterBankNet with multi-band
    filter bank
  name: XWStroke_XWFilterBankNet
  seed: 42
logging:
  console: true
  level: INFO
  tensorboard: false
model:
  args:
    band_channels: 32
    classifier_hidden: 0
    dropout: 0.3
    temporal_kernel: 64
    use_attention: true
  type: XWFilterBankNet
paths:
  checkpoint_dir: ./src/checkpoints
  data_dir: ./src/datasets
  fallback_checkpoint_dir: E:/EEGBCI_checkpoints
  root_dir: ./experiments
trainer:
  args: {}
  type: SupervisedTrainer
training:
  batch_size: 32
  deterministic: false
  device: cuda
  early_stopping:
    enabled: false
    min_delta: 0.001
    patience: 30
  epochs: 200
  k_folds: 5
  optimizer:
    lr: 0.001
    type: Adam
    weight_decay: 0.5
  save_checkpoints: true
  save_optimizer_state: false
  scheduler:
    type: cosine
  use_fp16_compression: true
visualization:
  plot_history: true
  plot_subject_comparison: true
  save_format: png
