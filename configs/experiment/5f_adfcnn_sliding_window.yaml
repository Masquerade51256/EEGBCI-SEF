# 5F Dataset with ADFCNN - Sliding Window Experiment
#
# Uses 1-second epochs but with 0.5-second sliding window stride,
# effectively doubling the number of training samples per trial.
# This is useful for datasets with limited trial counts.
#
# For 5F: ~900 trials/subject * 2 windows/trial = ~1800 samples/subject

experiment:
  name: "5F_ADFCNN_SlidingWindow"
  seed: 42
  description: "5F finger MI with sliding window (1s window, 0.5s stride) + ADFCNN + LOSO"

data:
  dataset: "5F"
  subjects: [1, 2, 3, 4, 5, 6, 7, 8]
  info_path: "configs/dataset/5F_sliding_window.yaml"

model:
  type: "ADFCNN"
  args: {}
    # Auto-populated:
    # num_channels: 21, num_classes: 5, input_length: 250, num_bands: 1

training:
  device: "cuda"
  epochs: 200
  batch_size: 32
  save_checkpoints: true
  save_optimizer_state: false
  use_fp16_compression: true
  deterministic: false

  optimizer:
    type: "Adam"
    lr: 0.001
    weight_decay: 0.01

  scheduler:
    type: "cosine"

  early_stopping:
    enabled: true
    patience: 30
    min_delta: 0.001

trainer:
  type: "LOSOTrainer"
  args: {}

paths:
  root_dir: "./experiments"

logging:
  level: "INFO"
  console: true
  tensorboard: false

visualization:
  plot_history: true
  plot_subject_comparison: true
  save_format: "png"
