experiment:
  description: Full 50-subject DANN LOSO with stroke-location domain adaptation
  name: XWStroke_DANN_Full50_LOSO
  seed: 42
logging:
  console: true
  level: INFO
model:
  args:
    domain_hidden_dims:
    - 256
    - 128
    num_domains: 4
  type: DANNADFCNN
paths:
  root_dir: ./experiments
trainer:
  args:
    domain_grouping: stroke_location_4class
    domain_loss_weight: 1.0
    gradient_accumulation_steps: 1
    grl_gamma: 10.0
    mixed_precision: true
    subject_buffer_size: 49
  type: DANNStreamingLOSOTrainer
training:
  batch_size: 512
  device: cuda
  epochs: 100
  num_workers: 4
  optimizer:
    lr: 0.001
    type: Adam
    weight_decay: 0.01
  pin_memory: true
  prefetch_factor: 2
  save_checkpoints: true
  use_fp16_compression: true
