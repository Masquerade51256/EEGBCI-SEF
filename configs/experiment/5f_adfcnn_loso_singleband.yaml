# 5F Dataset with ADFCNN - LOSO Single-Band Experiment
#
# Baseline configuration using Leave-One-Subject-Out (LOSO) evaluation
# with a single broadband filter [4, 40] Hz.
#
# Recommended as the first experiment to establish baseline performance.

experiment:
  name: "5F_ADFCNN_LOSO_SingleBand"
  seed: 42
  description: "5F finger MI baseline: ADFCNN + single-band + LOSO"

data:
  dataset: "5F"
  subjects: [1, 2, 3, 4, 5, 6, 7, 8]
  info_path: "configs/dataset/5F.yaml"

model:
  type: "ADFCNN"
  args: {}
    # Auto-populated:
    # num_channels: 21, num_classes: 5, input_length: 250, num_bands: 1

training:
  device: "cuda"
  epochs: 200
  batch_size: 32
  save_checkpoints: true
  save_optimizer_state: false
  use_fp16_compression: true
  deterministic: false

  optimizer:
    type: "Adam"
    lr: 0.001
    weight_decay: 0.01

  scheduler:
    type: "cosine"

  early_stopping:
    enabled: true
    patience: 30
    min_delta: 0.001

trainer:
  type: "LOSOTrainer"
  args: {}

paths:
  root_dir: "./experiments"

logging:
  level: "INFO"
  console: true
  tensorboard: false

visualization:
  plot_history: true
  plot_subject_comparison: true
  save_format: "png"
