# Scheme C: Subcortical Focus (RECOMMENDED PRIMARY)
# Criteria: Subcortical AND NIHSS<8 AND TaskA<=55%
# N=17, Expected Diff=+4.6%, Expected LOSO≈53-54%
#
# This is the RECOMMENDED primary scheme. It targets the stratum with the
# strongest neurophysiological rationale: subcortical lesions preserve cortical
# motor areas while damaging corticospinal tracts, making Aff+Align's
# hemisphere-level remapping maximally effective.
# N=17 balances statistical power and cohort homogeneity.

experiment:
  name: "XWStroke_SchemeC_SubcorticalFocus_LOSO"
  seed: 42
  description: "LOSO on 17-subject subcortical-focused cohort (primary recommended scheme)"

data:
  dataset: "XWStroke"
  subjects: [8, 9, 11, 16, 17, 23, 24, 25, 26, 27, 28, 29, 30, 31, 36, 37, 49]
  info_path: "configs/dataset/XWStroke_affected_aligned.yaml"

model:
  type: "ADFCNN"
  args: {}

training:
  device: "cuda"
  epochs: 50
  batch_size: 512
  save_checkpoints: true
  use_fp16_compression: true
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

  optimizer:
    type: "Adam"
    lr: 0.001
    weight_decay: 0.01

trainer:
  type: "StreamingLOSOTrainer"
  args:
    subject_buffer_size: 49
    gradient_accumulation_steps: 1
    mixed_precision: true
    # use_validation_early_stopping: true
    # early_stopping_patience: 15

paths:
  root_dir: "./experiments"

logging:
  level: "INFO"
  console: true
