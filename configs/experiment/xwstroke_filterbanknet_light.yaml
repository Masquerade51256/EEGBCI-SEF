# XWStroke dataset with XWFilterBankNetLight (lightweight version)
# Faster training with fewer parameters

experiment:
  name: "XWStroke_XWFilterBankNetLight"
  seed: 42
  description: "XW Stroke dataset classification using lightweight XWFilterBankNet"

data:
  dataset: "XWStroke"
  subjects: "all"
  info_path: "configs/dataset/XWStroke_multiband.yaml"

model:
  type: "XWFilterBankNetLight"
  args:
    # Light variant uses fewer parameters for faster training
    dropout: 0.3

training:
  device: "cuda"
  epochs: 200
  batch_size: 32
  k_folds: 5
  deterministic: false
  
  # Checkpoint settings
  save_checkpoints: true
  save_optimizer_state: false
  
  optimizer:
    type: "Adam"
    lr: 0.001
    weight_decay: 0.5
  
  scheduler:
    type: "cosine"
    
  early_stopping:
    enabled: false
    patience: 30
    min_delta: 0.001

trainer:
  type: "SupervisedTrainer"
  args: {}

paths:
  root_dir: "./experiments"
  data_dir: "./src/datasets"
  checkpoint_dir: "./src/checkpoints"

logging:
  level: "INFO"
  console: true
  tensorboard: false

visualization:
  plot_history: true
  plot_subject_comparison: true
  save_format: "png"
