data:
  dataset: BCICIV2a
  info_path: configs/dataset/BCICIV2a.yaml
  subjects:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
experiment:
  name: BCICIV2a_ADFCNN_LOSO
  seed: 42
logging:
  console: true
  level: INFO
model:
  args: {}
  type: ADFCNN
paths:
  root_dir: ./experiments
trainer:
  args:
    balance_classes: false
    inner_k_folds: 0
  type: LOSOTrainer
training:
  batch_size: 64
  device: cuda
  epochs: 150
  optimizer:
    lr: 0.001
    type: Adam
    weight_decay: 0.01
  save_checkpoints: true
  use_fp16_compression: true
