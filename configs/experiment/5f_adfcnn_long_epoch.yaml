# 5F Dataset with ADFCNN - Long Epoch (2s) + Sliding Window Experiment
#
# Extracts 2-second epochs (stimulus onset + extended period)
# and applies sliding window segmentation for data augmentation.
# This captures more temporal dynamics than the default 1s epoch.
#
# Epoch composition (approximate):
#   - 0.0-1.0s: Stimulus presentation (MI execution)
#   - 1.0-2.0s: Post-stimulus rebound/relaxation period
#
# Sliding window: 1.0s window, 0.5s stride -> ~3 windows per 2s epoch

experiment:
  name: "5F_ADFCNN_LongEpoch_Sliding"
  seed: 42
  description: "5F finger MI with 2s epochs + sliding window + ADFCNN + LOSO"

data:
  dataset: "5F"
  subjects: [1, 2, 3, 4, 5, 6, 7, 8]
  info_path: "configs/dataset/5F_long_epoch.yaml"

model:
  type: "ADFCNN"
  args: {}
    # Auto-populated:
    # num_channels: 21, num_classes: 5, input_length: 250, num_bands: 1

training:
  device: "cuda"
  epochs: 200
  batch_size: 32
  save_checkpoints: true
  save_optimizer_state: false
  use_fp16_compression: true
  deterministic: false

  optimizer:
    type: "Adam"
    lr: 0.001
    weight_decay: 0.01

  scheduler:
    type: "cosine"

  early_stopping:
    enabled: true
    patience: 30
    min_delta: 0.001

trainer:
  type: "LOSOTrainer"
  args: {}

paths:
  root_dir: "./experiments"

logging:
  level: "INFO"
  console: true
  tensorboard: false

visualization:
  plot_history: true
  plot_subject_comparison: true
  save_format: "png"
