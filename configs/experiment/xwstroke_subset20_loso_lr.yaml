# Subset-20 Representative LOSO: Left/Right labels (Task A)
# Purpose: Rapid validation baseline for method iteration
# Sampling: Stratified by lesion location, NIHSS, paralysis side, duration, artifact status
# Expected behavior: Results should be generalizable to full N=50 cohort

experiment:
  name: "XWStroke_Subset20_LOSO_LR"
  seed: 42
  description: "Subset-20 representative LOSO with left/right labels (baseline)"

data:
  dataset: "XWStroke"
  info_path: "configs/dataset/XWStroke_subset20_representative.yaml"

model:
  type: "ADFCNN"
  args:
    num_channels: 30
    num_bands: 1
    input_length: 500

training:
  device: "cuda"
  epochs: 100
  batch_size: 512
  save_checkpoints: true
  use_fp16_compression: true
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  
  optimizer:
    type: "Adam"
    lr: 0.001
    weight_decay: 0.01

trainer:
  type: "StreamingLOSOTrainer"
  args:
    subject_buffer_size: 19
    gradient_accumulation_steps: 1
    mixed_precision: true

paths:
  root_dir: "./experiments"

logging:
  level: "INFO"
  console: true
