data:
  dataset: XWStrokeEDF
  info_path: configs/dataset/XWStroke_EDF_paper.yaml
  subjects: all
experiment:
  description: XWStroke EDF raw data without artifact removal, using ADFCNN (paper-faithful
    settings)
  name: Ablation_EDF_Baseline_ADFCNN
  seed: 42
logging:
  console: true
  level: INFO
  tensorboard: false
model:
  args: {}
  type: ADFCNN
paths:
  checkpoint_dir: ./src/checkpoints
  data_dir: ./src/datasets
  root_dir: ./experiments
trainer:
  args: {}
  type: SupervisedTrainer
training:
  batch_size: 32
  deterministic: false
  device: cuda
  early_stopping:
    enabled: false
    min_delta: 0.001
    patience: 30
  epochs: 200
  k_folds: 5
  optimizer:
    lr: 0.001
    type: Adam
    weight_decay: 0.0
  scheduler:
    type: none
visualization:
  plot_history: true
  plot_subject_comparison: true
  save_format: png
